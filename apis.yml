aid: civica-digital
name: Civica Digital
description: >-
  Cívica Digital is a Mexican civic-technology company, founded in 2015 and backed by 500 Global,
  that helps governments, public institutions, and organizations design, build, and launch digital
  services for citizens. Its product portfolio includes Urbem, a platform for digitizing government
  procedures and citizen-facing services; Signum, a digital document and official-records management
  system with electronic signatures; and a suite of conversational AI agents that support citizens
  over WhatsApp, phone, and web. The company focuses on digital government transformation across
  Latin America. No public API, developer portal, or OpenAPI surface has been located; this profile
  captures the company's public web presence, legal pages, and domain-security posture.
